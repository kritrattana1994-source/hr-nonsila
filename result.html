x7b\x7d\\r\\n\x7d\\r\\nfunction safeJSONParse(str) \x7b\\r\\n  if (!str || str \x3d\x3d\x3d \x27undefined\x27) return null;\\r\\n  try \x7b return JSON.parse(str); \x7d catch(e) \x7b return null; \x7d\\r\\n\x7d\\r\\n\\r\\n\\r\\nlet toastTimer;\\r\\nfunction showToast(msg, type\x3d\x27success\x27) \x7b\\r\\n  const el \x3d document.getElementById(\x27toast\x27);\\r\\n  if (!el) return;\\r\\n  const icons \x3d \x7b success:\x27check-circle\x27, error:\x27exclamation-circle\x27, info:\x27info-circle\x27 \x7d;\\r\\n  el.innerHTML \x3d `\x3ci class\x3d\\\x22fas fa-$\x7bicons\x5btype\x5d||\x27info-circle\x27\x7d\\\x22\x3e\x3c\\\/i\x3e$\x7bmsg\x7d`;\\r\\n  el.className \x3d `toast $\x7btype\x7d`;\\r\\n  clearTimeout(toastTimer);\\r\\n  toastTimer \x3d setTimeout(() \x3d\x3e el.className \x3d \x27toast hidden\x27, 3500);\\r\\n\x7d\\r\\nwindow.showToast \x3d showToast;\\r\\n\\r\\nfunction openModal(id) \x7b\\r\\n  const el \x3d document.getElementById(id);\\r\\n  if (el) el.classList.remove(\x27hidden\x27);\\r\\n\x7d\\r\\nwindow.openModal \x3d openModal;\\r\\n\\r\\nfunction closeModal(id) \x7b\\r\\n  const el \x3d document.getElementById(id);\\r\\n  if (el) el.classList.add(\x27hidden\x27);\\r\\n\x7d\\r\\nwindow.closeModal \x3d closeModal;\\r\\n\\r\\n\/\/ ── State ─────────────────────────────────────────\\r\\n  const State \x3d \x7b\\n    token: safeGetItem(\x27hr_token\x27) || \x27\x27,\\n    user: safeJSONParse(safeGetItem(\x27hr_user\x27)),\\n    page: \x27dashboard\x27,\\n    staffList: \x5b\x5d,\\n    courseList:\x5b\x5d,\\n    charts: \x7b\x7d\\n  \x7d;\\n  window.showApp \x3d showApp;\\n  window.doNavigate \x3d doNavigateInternal;\\nwindow.navigate \x3d doNavigateInternal;\\n  window.renderDashboard \x3d renderDashboard;\\n  window.renderStaffList \x3d renderStaffList;\\n  window.renderCompetencies \x3d renderCompetencies;\\n\\n  window.renderUsers \x3d renderUsers;\\n  window.renderImport \x3d renderImport;\\r\\n\\r\\nasync function loadAndApplyMenuPermissions() \x7b\\r\\n  try \x7b\\r\\n    const permissions \x3d await api(\x27getMenuPermissions\x27);\\r\\n    State.menuPermissions \x3d permissions;\\r\\n    applyMenuPermissions(permissions);\\r\\n  \x7d catch(e) \x7b\\r\\n    console.error(\x27Failed to load menu permissions:\x27, e);\\r\\n  \x7d\\r\\n\x7d\\r\\n\\r\\nfunction applyMenuPermissions(permissions) \x7b\\r\\n  if (!permissions || !Array.isArray(permissions)) return;\\r\\n  const userRole \x3d (State.user \x26\x26 State.user.role) ? State.user.role : \x27low\x27;\\r\\n\\r\\n  const menuElementMap \x3d \x7b\\r\\n    dashboard:  document.getElementById(\x27navDashboard\x27),\\r\\n    staffList:  document.getElementById(\x27navStaffList\x27),\\r\\n    \\r\\n    onboarding: document.getElementById(\x27navOnboarding\x27),\\r\\n    training:   document.getElementById(\x27navTraining\x27),\\r\\n    courses:    document.getElementById(\x27navCourses\x27),\\r\\n    reports:    document.getElementById(\x27navReports\x27),\\r\\n    users:      document.querySelector(\x27.nav-item\x5bdata-page\x3d\\\x22users\\\x22\x5d\x27),\\r\\n    import:     document.querySelector(\x27.nav-item\x5bdata-page\x3d\\\x22import\\\x22\x5d\x27),\\r\\n    sheetLink:  document.getElementById(\x27sidebarSheetLink\x27),\\r\\n    driveLink:  document.getElementById(\x27sidebarDriveLink\x27),\\r\\n  \x7d;\\r\\n\\r\\n  permissions.forEach(m \x3d\x3e \x7b\\r\\n    const el \x3d menuElementMap\x5bm.menuId\x5d;\\r\\n    if (el) \x7b\\r\\n      const canAccess \x3d (userRole \x3d\x3d\x3d \x27admin\x27) ? true : !!m\x5buserRole\x5d;\\r\\n      if (canAccess) \x7b\\r\\n        el.style.display \x3d \x27\x27;\\r\\n        el.classList.remove(\x27hidden\x27);\\r\\n      \x7d else \x7b\\r\\n        el.style.display \x3d \x27none\x27;\\r\\n        el.classList.add(\x27hidden\x27);\\r\\n      \x7d\\r\\n    \x7d\\r\\n  \x7d);\\r\\n\\r\\n  \\r\\n  const adminNav \x3d document.getElementById(\x27adminNav\x27);\\r\\n  if (adminNav) \x7b\\r\\n    const usersItem  \x3d d
