  let val = null;

  if (!val) {
    try { val = window.sessionStorage.getItem(key); } catch(e) {}
  }

}
function safeSetItem(key, val) {
  try { window.localStorage.setItem(key, val); } catch(e) {}
  try { window.sessionStorage.setItem(key, val); } catch(e) {}
}
function safeRemoveItem(key) {
  try { window.localStorage.removeItem(key); } catch(e) {}

// ── Advanced Resilient API Client with Queue, Cache & Auto-Retry ──
const _apiCache = new Map();
const _API_CACHE_TTL = {
  'getAllDepartments': 5 * 60 * 1000,
  'getDepartmentsPublic': 5 * 60 * 1000,
  'getMenuPermissions': 5 * 60 * 1000,
  'getCourseList': 3 * 60 * 1000,
  'getStaffListPublic': 2 * 60 * 1000
};

// Invalidate cache on mutations
function _invalidateApiCache(action) {
  if (!action) return;
  if (/^(add|update|delete|save|resign|cancel|import|create|set)/i.test(action)) {
    if (action.includes('Staff') || action.includes('Department')) {
      _apiCache.delete('getAllDepartments');
      _apiCache.delete('getDepartmentsPublic');
      _apiCache.delete('getStaffListPublic');
    }
    if (action.includes('Course')) {
      _apiCache.delete('getCourseList');
    }
    if (action.includes('Menu') || action.includes('Role') || action.includes('User')) {
      _apiCache.delete('getMenuPermissions');
    }
  }
}

// Concurrency Throttling Queue (Max 2 simultaneous requests)
const _apiQueue = [];
let _activeApiRequests = 0;
const _MAX_CONCURRENT_REQUESTS = 2;

function _dequeueApi() {
  if (_activeApiRequests >= _MAX_CONCURRENT_REQUESTS || _apiQueue.length === 0) return;
  const task = _apiQueue.shift();
  _activeApiRequests++;
  task.fn().finally(() => {
    _activeApiRequests--;
    _dequeueApi();
  });
}

function _queuedApiCall(fn) {
  return new Promise((resolve, reject) => {
    _apiQueue.push({
      fn: () => fn().then(resolve).catch(reject)
    });
    _dequeueApi();
  });
}

function _apiOnce(action, params) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success) {
          resolve(res.data);
        } else {
          reject(new Error((res && res.error) || 'เกิดข้อผิดพลาด'));
        }
      })
      .withFailureHandler(err => {
        reject(new Error((err && err.message) || 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์'));
      })
      .handleApiCall(action, { token: State.token, ...params });
  });
}

async function api(action, params={}, options={}) {
  _invalidateApiCache(action);

  // Check in-memory cache for read operations
  const cacheKey = action + '_' + JSON.stringify(params || {});
  const ttl = _API_CACHE_TTL[action] || 0;
  if (ttl > 0 && !options.skipCache && (!params || Object.keys(params).length === 0)) {
    const cached = _apiCache.get(cacheKey);
    if (cached && (Date.now() - cached.time < ttl)) {
      return cached.data;
    }
  }

  const MAX_RETRIES = 3;
  let lastErr;

  return _queuedApiCall(async () => {
    for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
      try {
        const result = await _apiOnce(action, params);
        if (ttl > 0) {
          _apiCache.set(cacheKey, { time: Date.now(), data: result });
        }
        return result;
      } catch (err) {
        lastErr = err;
        const msg = (err && err.message) || '';

        const isAuthError = msg.includes('ไม่ได้เข้าสู่ระบบ') || msg.includes('Session หมดอายุ') || msg.includes('รหัสผ่านไม่ถูกต้อง');
        const shouldRetry = attempt < MAX_RETRIES && !isAuthError && (
          msg.includes('404') ||
          msg.includes('503') ||
          msg.includes('500') ||
          msg.includes('502') ||
          msg.includes('429') ||
          msg.includes('HTML') ||
          msg.includes('เชื่อมต่อ') ||
          msg.includes('network') ||
          msg.includes('Script') ||
          msg.includes('Failed to fetch') ||
          msg.includes('NetworkError') ||
          msg.includes('Lock') ||
          msg.includes('ว่างเปล่า')
        );

        if (!shouldRetry) {
          throw err;
        }

        const baseDelay = [600, 1200, 2000][attempt] || 2000;
        const jitter = Math.floor(Math.random() * 250);
        console.warn(`[API Retry] '${action}' (attempt ${attempt + 1}/${MAX_RETRIES + 1}): ${msg}. Retrying in ${baseDelay + jitter}ms...`);
        await new Promise(resolve => setTimeout(resolve, baseDelay + jitter));
      }
    }
    throw lastErr;
  });
}
window.api = api;

function applyMenuPermissions(permissions) {
  if (!permissions || !Array.isArray(permissions)) return;
  const userRole = (State.user && State.user.role) ? State.user.role : 'low';

  const menuElementMap = {
    dashboard:  document.getElementById('navDashboard'),
    staffList:  document.getElementById('navStaffList'),
    onboarding: document.getElementById('navOnboarding'),
    competencies: document.getElementById('navCompetencies'),
    users:      document.querySelector('.nav-item[data-page="users"]'),
    import:     document.querySelector('.nav-item[data-page="import"]'),
    sheetLink:  document.getElementById('sidebarSheetLink'),
    driveLink:  document.getElementById('sidebarDriveLink'),
  };

  permissions.forEach(m => {
    const el = menuElementMap[m.menuId];
    if (el) {
      const canAccess = (userRole === 'admin') ? true : !!m[userRole];
      if (canAccess) {
        el.style.display = '';
        el.classList.remove('hidden');
      } else {
        el.style.display = 'none';
        el.classList.add('hidden');
      }
    }
  });

  // Admin Nav Section Visibility
  const adminNav = document.getElementById('adminNav');
  if (adminNav) {
    const usersItem  = document.querySelector('.nav-item[data-page="users"]');
    const importItem = document.querySelector('.nav-item[data-page="import"]');
    const sheetItem  = document.getElementById('sidebarSheetLink');
    const driveItem  = document.getElementById('sidebarDriveLink');

    const hasAnyAdminItem = [usersItem, importItem, sheetItem, driveItem].some(el => el && el.style.display !== 'none');

      adminNav.style.display = '';
      adminNav.classList.remove('hidden');
    } else {
      adminNav.style.display = 'none';
      adminNav.classList.add('hidden');
    }
  }

  // If user is Low role and has limited menu, ensure profile link is accessible

    const myProfile = document.getElementById('navMyProfile');
    if (myProfile) {
      myProfile.style.display = '';
      myProfile.classList.remove('hidden');
    }
  }
}

// ── Chart Rendering Helper ────────────────────────
const chartInstances = {};

function renderChart(canvasId, type, labels, dataValues, legendLabel, colors, retries) {
  retries = retries || 0;
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  if (chartInstances[canvasId]) {
    chartInstances[canvasId].destroy();
  }

  if (typeof Chart === 'undefined') {
    if (retries < 10) {
      setTimeout(function() {
        renderChart(canvasId, type, labels, dataValues, legendLabel, colors, retries + 1);
      }, 400);
    } else {
      console.warn('Chart.js could not be loaded after 10 retries for ' + canvasId);
    }
    return;
  }

  const ctx = canvas.getContext('2d');
  const bgColors = Array.isArray(colors) ? [...colors] : [colors];
  while (bgColors.length < (labels ? labels.length : 0)) {
    bgColors.push(...bgColors);
  }
  const sliceColors = bgColors.slice(0, labels ? labels.length : 0);

  try {
    chartInstances[canvasId] = new Chart(ctx, {
      type: type,
      data: {
        labels: labels || [],
        datasets: [{
          label: legendLabel || '',
          data: dataValues || [],
          backgroundColor: type === 'bar' ? sliceColors : sliceColors,
          borderColor: type === 'bar' ? 'transparent' : '#ffffff',
          borderWidth: type === 'bar' ? 0 : 2,
          borderRadius: type === 'bar' ? 6 : 0,
          borderSkipped: false
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, legend: { display: type !== 'bar', position: 'bottom' }, plugins: { legend: {
            display: type !== 'bar',
            position: 'bottom',
            labels: { padding: 12, font: { size: 11, family: "'Sarabun', sans-serif" } }
          }
        },
        scales: type === 'bar' ? {
          y: { beginAtZero: true, ticks: { precision: 0, font: { family: "'Sarabun', sans-serif" } }, grid: { color: 'rgba(0,0,0,0.04)' } },
          x: { grid: { display: false }, ticks: { font: { family: "'Sarabun', sans-serif" } } }
        } : {}
      }
    });
  } catch(e) {
    console.error('Error rendering chart ' + canvasId + ':', e);
  }
}

async function saveOnboarding(e) {

  const group = data.group;
  if (group === 'พยาบาล' || group === 'AEMT') {
    data.nurseData = {
      licenseNo: fd.get('licenseNo'),
      licenseIssue: fd.get('licenseIssue'),
      licenseExpiry: fd.get('licenseValidity'),
      appointDate: fd.get('appointDate'),
      retireDate: fd.get('retireDate')
    };
  }
  
  try {
    await api('addStaff', { data });
    showToast('ลงทะเบียนพนักงานใหม่สำเร็จ และระบบสร้างบัญชีผู้ใช้งานระดับต่ำ (Low) ให้เรียบร้อยแล้ว', 'success');

  }
}

function cleanPrefix(name) {
  if (!name) return '';
  let res = name;
  const prefixes = ['นาย', 'นางสาว', 'นาง'];
  for (let i = 0; i < prefixes.length; i++) {
    if (res.indexOf(prefixes[i]) === 0) {
      res = res.substring(prefixes[i].length);
      break;
    }
  }
  return res.trim();
}

function photoPlaceholder(name) {
  const ch = name ? cleanPrefix(name).charAt(0) : '?';
  return `<div class="staff-photo-placeholder">${ch}</div>`;
}

function empTypeBadge(type) {
  if (!type) return 'gray';
  if (type.includes('ข้าราชการ')) return 'green';
  if (type.includes('ลูกจ้างชั่วคราวรายเดือน')) return 'orange';
  if (type.includes('ลูกจ้างชั่วคราวรายวัน')) return 'orange';
  if (type.includes('พนักงานกระทรวง')) return 'blue';
  return 'gray';
}

let searchTimer;
function debounceSearch(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    staffFilters.search = val;
    renderStaffList(staffFilters);
  }, 350);
}

function applyFilters() {
  staffFilters.dept  = (document.getElementById('filterDept') ? document.getElementById('filterDept').value : '')  || '';
  staffFilters.group = (document.getElementById('filterGroup') ? document.getElementById('filterGroup').value : '');
  staffFilters.type  = (document.getElementById('filterType') ? document.getElementById('filterType').value : '')  || '';
  renderStaffList(staffFilters);
}

async function saveStaff(e, id) {
  e.preventDefault();
  const form = e.target;
  const fd   = new FormData(form);
  const data = Object.fromEntries(fd.entries());

  // Collect nurse data
  const group = data.group;
  if (group === 'พยาบาล' || group === 'AEMT') {
    data.nurseData = {
      licenseNo:    fd.get('licenseNo'),
      licenseIssue: fd.get('licenseIssue'),
      licenseExpiry:fd.get('licenseExpiry'),
      appointDate:  fd.get('appointDate'),
      retireDate:   fd.get('retireDate'),
    };
  }

  try {
    if (id) {
      await api('updateStaff', { id, data });
      showToast('แก้ไขข้อมูลสำเร็จ', 'success');
    } else {
      const res = await api('addStaff', { data });
      showToast('เพิ่มบุคลากรสำเร็จ', 'success');
    }
    closeModal('staffModal');
    renderStaffList(staffFilters);
  } catch(err) {
    showToast(err.message, 'error');
  }
}

async function deleteStaff(id, name) {

      renderStaffList(staffFilters);
    } catch(e) { showToast(e.message, 'error') }
  });
}

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  const tabEl = document.getElementById(tabId); if (tabEl) tabEl.classList.add('active');
  if (btn) btn.classList.add('active');
}

  return docs.map(doc => `
    <div class="doc-item">

    </div>`).join('');
}

// ── File Operations ───────────────────────────────

async function uploadPhoto(e, staffId) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { showToast('ไฟล์ใหญ่เกิน 5MB', 'error'); return; }
  showToast('กำลังอัปโหลดรูป...', 'info');
  try {
    const base64 = await fileToBase64(file);
    const res = await api('uploadPhoto', { staffId, base64, mimeType: file.type, fileName: file.name });
    showToast('อัปโหลดรูปสำเร็จ', 'success');
    // อัปเดตรูปทันทีโดยไม่ต้อง reload ทั้งหน้า
    if (res && res.fileId) {
      const thumbUrl = 'https://drive.google.com/thumbnail?id=' + res.fileId + '&sz=w300';
      const photoWrap = document.getElementById('profilePhotoWrap');
      if (photoWrap) {
        photoWrap.innerHTML = '<img src="' + thumbUrl + '" class="profile-photo-large" id="profilePhoto" onerror="this.style.display=\'none\'">';
      }
    } else {
      viewProfile(staffId);
    }
  } catch(err) { showToast(err.message, 'error') }
}

async function uploadDocument(e, staffId, staffName) {
  const files = Array.from(e.target.files);
  const docType = (document.getElementById('docTypeSelect') ? document.getElementById('docTypeSelect').value : 'อื่นๆ');
  for (const file of files) {
    if (file.size > 10 * 1024 * 1024) { showToast('ไฟล์ ' + file.name + ' ใหญ่เกิน 10MB', 'error'); continue; }
    showToast('กำลังอัปโหลด ' + file.name, 'info');
    try {
      const base64 = await fileToBase64(file);
      await api('uploadDocument', { staffId, base64, mimeType: file.type, fileName: file.name, docType });
      showToast('อัปโหลด ' + file.name + ' สำเร็จ', 'success');
    } catch(err) { showToast(err.message, 'error') }
  }
  viewProfile(staffId);
}

async function uploadCertificate(e, staffId, trainingId) {
  const file = e.target.files[0];
  if (!file) return;
  showToast('กำลังอัปโหลดเกียรติบัตร...', 'info');
  try {
    const base64 = await fileToBase64(file);
    await api('uploadCertificate', { staffId, trainingId, base64, mimeType: file.type, fileName: file.name });
    showToast('อัปโหลดเกียรติบัตรสำเร็จ', 'success');
    viewProfile(staffId);
  } catch(err) { showToast(err.message, 'error') }
}

async function deleteDocument(fileId, docId, staffId) {
  confirmAction('ลบเอกสาร', 'ยืนยันการลบเอกสารนี้?', async () => {
    try {
      await api('deleteDocument', { fileId, docId });
      showToast('ลบเอกสารสำเร็จ', 'success');
      viewProfile(staffId);
    } catch(e) { showToast(e.message, 'error') }
  });
}

// ── Utility: File → Base64 ────────────────────────
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.readAsDataURL(file);
  });
}

  const search = (document.getElementById('tSearch') && document.getElementById('tSearch').value ? document.getElementById('tSearch').value.toLowerCase() : '');
  let data = window._allTraining || [];
  if (year) data = data.filter(t => String(t.year) === String(year));
  if (type) data = data.filter(t => t.type === type);
  if (search) data = data.filter(t =>
    (t.name ? t.name.toLowerCase().includes(search) : false) ||
    (t.course ? t.course.toLowerCase().includes(search) : false)
  );
  document.getElementById('trainingTableWrap').innerHTML = renderAllTrainingTable(data);
  document.getElementById('tCount').textContent = data.length + ' รายการ';
}

function openAddCourse(data={}, id=null) {
  document.getElementById('trainingModalTitle').textContent = id ? 'แก้ไขหลักสูตร' : 'เพิ่มหลักสูตร';
  document.getElementById('trainingModalBody').innerHTML = `
  <form onsubmit="window.saveCourse(event,${id})">

    <div class="form-grid-2">

      <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i>บันทึก</button>
    </div>
  </form>`;

async function openEditCourse(id) {
  const courses = await api('getCourseList');
  const course  = courses.find(c => c.id == id);
  if (!course) return;
  openAddCourse(course, id);
}

async function saveCourse(e, id) {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  try {
    if (id) { await api('updateCourse', { id, data }); showToast('แก้ไขสำเร็จ','success'); }
    else     { await api('addCourse',    { data });     showToast('เพิ่มสำเร็จ','success'); }
    closeModal('trainingModal');
    renderCourses();
  } catch(err) { showToast(err.message, 'error') }
}

async function deleteCourse(id, name) {
  confirmAction('ลบหลักสูตร', `ยืนยันการลบ "${name}"?`, async () => {
    try { await api('deleteCourse', { id }); showToast('ลบสำเร็จ','success'); renderCourses(); }
    catch(e) { showToast(e.message, 'error') }
  });
}

async function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const prog = document.getElementById('importProgress');
  prog.innerHTML = '<div className="loading"><div class="spinner"></div><span>กำลังอ่านไฟล์ Excel...</span></div>';

  try {
    const ab = await file.arrayBuffer();
    const wb = XLSX.read(ab, { type:'array' });

    const sheetMap = {
      nurses:   'ข้อมูลพนักงานพยาบาล ต่อกัน',
      aemt:     'ประวัติ พยาบาลAEMT',
      staff:    'ประวัติ พนักงาน',
      training: 'ADD อบรมหลักสูตรแต่ละคน',
      courses:  'ทะเบียนหลักสูตรสมรรถนะ',
    };

    const data = {};
    Object.keys(sheetMap).forEach(key => {
      const ws = wb.Sheets[sheetMap[key]];
      if (ws) data[key] = XLSX.utils.sheet_to_json(ws, { defval:'' }).filter(r => r['ชื่อ-สกุล'] || r['หลักสูตร']);
    });

    window.pendingImportData = data;
    prog.innerHTML = `
      <div class="card" style="border:2px solid var(--primary)">
        <div class="card-title" style="margin-bottom:1rem"><i class="fas fa-eye"></i>ตรวจสอบข้อมูลก่อนนำเข้า</div>
        <div class="stats-grid" style="grid-template-columns:repeat(5,1fr)">
          ${Object.keys(data).map(k=>`
            <div class="stat-card">
              <div class="stat-icon green"><i class="fas fa-table"></i></div>
              <div><div class="stat-value">${(data[k]||[]).length}</div><div class="stat-label">${{nurses:'พยาบาล',aemt:'พยาบาล AEMT',staff:'พนักงาน',training:'อบรม',courses:'หลักสูตร'}[k]}</div></div>
            </div>`).join('')}
        </div>
        <div style="margin-top:1.5rem">
          <button class="btn btn-primary" onclick="window.confirmImport()">
            <i class="fas fa-file-import"></i>นำเข้าข้อมูลทั้งหมด
          </button>
        </div>
      </div>`;
  } catch(err) {
    prog.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation"></i><p>${err.message}</p></div>`;
  }
}

function formatDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    const day = d.getDate().toString().padStart(2,'0');
    const mon = (d.getMonth()+1).toString().padStart(2,'0');
    const yr  = d.getFullYear() + 543;
    return `${day}/${mon}/${yr}`;
  } catch(e) { return iso }
}

}

    const apiFn = typeof api === 'function' ? api : window.api;
    await apiFn('registerStaffPublic', { data: data });
    if (typeof showToast === 'function') showToast('ลงทะเบียนสำเร็จ! เข้าสู่ระบบด้วยเลขบัตรประชาชน รหัสผ่านคือเบอร์โทรศัพท์', 'success');
    window.closeRegisterForm();
  } catch(err) {
    if (typeof showToast === 'function') showToast('ล้มเหลว: ' + err.message, 'error');
    else alert('ล้มเหลว: ' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> บันทึกข้อมูลลงทะเบียน'; }
  }
};




window.addEventListener('DOMContentLoaded', function() {
  if (window.State && window.State.token && window.State.user) {
    if (typeof window.showApp === 'function') window.showApp();
    const lastPage = window.safeGetItem ? window.safeGetItem('hr_last_page') : localStorage.getItem('hr_last_page');
    if (typeof window.navigate === 'function') window.navigate(lastPage || 'dashboard');
  }
});

window.handleLogout = function() {
  if (typeof safeRemoveItem === 'function') {
    safeRemoveItem('hr_token');
    safeRemoveItem('hr_user');
  } else {
    localStorage.removeItem('hr_token');
    localStorage.removeItem('hr_user');
    sessionStorage.removeItem('hr_token');
    sessionStorage.removeItem('hr_user');
  }
  if (window.State) {
    window.State.token = null;
    window.State.user = null;
  }
  const loginP = document.getElementById('loginPage');
  const mainA = document.getElementById('mainApp');
  if(loginP) loginP.classList.remove('hidden');
  if(mainA) mainA.classList.add('hidden');
  
  const u = document.getElementById('loginUser');
  const p = document.getElementById('loginPass');
  if(u) u.value = '';
  if(p) p.value = '';
  
  if (typeof showToast === 'function') showToast('ออกจากระบบแล้ว', 'info');
};

</script>
